# ===================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (PostgreSQL)
# ===================================================================
# Altere 'localhost:5432/nome_do_banco' para a URL/Host do seu banco na nuvem
spring.datasource.url=jdbc:postgresql://localhost:5432/db_camisetas
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===================================================================
# ddl-auto:
# - 'update': cria/atualiza as tabelas no banco automaticamente ao iniciar a aplicação (ideal para desenvolvimento)
# - 'validate': apenas valida o esquema sem alterar nada (ideal para produção)
spring.jpa.hibernate.ddl-auto=update

# Exibe o SQL gerado no console (útil para testes)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto específico para o PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
